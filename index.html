<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Story documentation for ADA Challenge 4.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Story Documentation</title>
  <script>
    const currentUrl = new URL(location.href);
    if (location.hostname.endsWith(".github.io") && !currentUrl.searchParams.has("_fresh")) {
      currentUrl.searchParams.set("_fresh", Date.now());
      location.replace(currentUrl);
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      color-scheme: dark;
      --color-primary: oklch(62.3% 0.214 259.815);
      --color-primary-content: #061225;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100dvh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100dvh;
      padding: 28px 20px;
      overflow-y: auto;
      border-right: 1px solid var(--color-base-300);
    }

    .brand {
      margin: 0 0 4px;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand-note {
      margin: 0 0 30px;
      color: color-mix(in oklab, var(--color-base-content) 60%, transparent);
      font-size: 0.875rem;
    }

    .story-group + .story-group {
      margin-top: 24px;
    }

    .story-title {
      margin: 0 0 8px;
      color: color-mix(in oklab, var(--color-base-content) 60%, transparent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chapter-nav {
      display: grid;
      gap: 6px;
    }

    .chapter-button {
      width: 100%;
      text-align: left;
    }

    .chapter-button[aria-current="page"] {
      color: var(--color-primary);
      font-weight: 700;
      background: color-mix(in oklab, var(--color-primary) 14%, var(--color-base-100));
    }

    main {
      min-width: 0;
      padding: 32px clamp(20px, 4vw, 56px) 64px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(100%, 960px);
      margin: 0 auto 20px;
    }

    .view-tabs,
    .downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar[hidden],
    .view-tabs[hidden],
    .download[hidden] {
      display: none;
    }

    .document {
      width: min(100%, 960px);
      min-height: 400px;
      margin: 0 auto;
      padding: clamp(24px, 4vw, 48px);
      overflow: hidden;
    }

    .document h1,
    .document h2,
    .document h3,
    .document h4,
    .document h5 {
      line-height: 1.25;
      letter-spacing: -0.025em;
      font-weight: 700;
    }

    .document h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.75rem, 3vw, 2.125rem);
    }

    .document h2 {
      margin: 2.25rem 0 0.75rem;
      padding-bottom: 0.625rem;
      font-size: 1.35rem;
      border-bottom: 1px solid var(--color-base-300);
    }

    .document h1 + h2 {
      margin-top: 1.25rem;
    }

    .document h3 {
      margin: 3rem 0 0.75rem;
      font-size: 1.2rem;
    }

    .document h4,
    .document h5 {
      margin: 2rem 0 0.625rem;
      font-size: 1.05rem;
    }

    .document p {
      max-width: 75ch;
      margin: 0.75rem 0;
    }

    .document > p:has(> strong:only-child) {
      margin: 2rem 0 0.5rem;
      font-size: 1.025rem;
    }

    .document ul,
    .document ol {
      margin: 0.625rem 0 1rem;
      padding-left: 1.5rem;
    }

    .document a {
      color: var(--color-primary);
    }

    .document blockquote {
      margin: 1.5rem 0;
      padding: 14px 18px;
      background: color-mix(in oklab, var(--color-primary) 10%, var(--color-base-100));
      border: 1px solid color-mix(in oklab, var(--color-primary) 24%, var(--color-base-100));
      border-radius: var(--radius-box);
    }

    .document blockquote p {
      margin: 0.25rem 0;
    }

    .table-scroll {
      width: 100%;
      margin: 0.75rem 0 2rem;
      overflow-x: auto;
    }

    .document table {
      width: 100%;
      min-width: 100%;
      margin: 0;
      border-collapse: collapse;
      font-size: 0.925rem;
      line-height: 1.5;
    }

    .document table.asset-table {
      min-width: 560px;
    }

    .document th,
    .document td {
      padding: 9px 12px;
      text-align: left;
      border-bottom: 1px solid var(--color-base-300);
    }

    .document th:first-child,
    .document td:first-child {
      width: 32%;
    }

    .document th {
      background: var(--color-base-200);
    }

    .document code {
      padding: 0.15em 0.35em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      white-space: nowrap;
      background: var(--color-base-200);
      border-radius: var(--radius-field);
    }

    .document pre {
      max-width: 100%;
      padding: 18px;
      overflow: auto;
      background: var(--color-base-200);
      border-radius: var(--radius-box);
    }

    .document pre code {
      padding: 0;
      background: transparent;
    }

    .document .mermaid {
      display: flex;
      justify-content: center;
      padding: 24px;
      max-height: 72vh;
      overflow: auto;
      background: var(--color-base-100);
      border: 1px solid var(--color-base-300);
    }

    .document .mermaid svg {
      display: block;
      min-width: 1100px;
      max-width: none !important;
      height: auto;
      margin: 0 auto;
    }

    .json-preview {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.6;
      white-space: pre;
    }

    .json-preview code {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      .shell {
        display: block;
      }

      aside {
        position: static;
        width: 100%;
        height: auto;
        padding: 20px;
        border-right: 0;
        border-bottom: 1px solid var(--color-base-300);
      }

      .brand-note {
        margin-bottom: 18px;
      }

      .chapter-nav {
        display: flex;
        overflow-x: auto;
      }

      .chapter-button {
        width: auto;
        min-width: max-content;
      }

      main {
        padding: 24px 14px 56px;
      }

      .toolbar {
        align-items: stretch;
      }

      .view-tabs,
      .downloads {
        width: 100%;
      }

      .view-tab,
      .download {
        flex: 1;
        text-align: center;
        white-space: nowrap;
      }

      .document {
        padding: 22px 16px;
      }

      .document h1 {
        font-size: 1.625rem;
      }

      .document h2 {
        font-size: 1.2rem;
      }

      .document table {
        font-size: 0.875rem;
      }

      .document th,
      .document td {
        padding: 8px 10px;
      }

    }
  </style>
</head>
<body class="bg-base-200 text-base-content">
  <div class="shell">
    <aside class="bg-base-100" aria-label="Story chapters">
      <h1 class="brand">Story Documentation</h1>
      <p class="brand-note">ADA Challenge 4</p>
      <nav id="chapter-nav"></nav>
    </aside>

    <main>
      <div class="toolbar">
        <div class="view-tabs tabs tabs-border" role="tablist" aria-label="Preview format">
          <button class="view-tab tab tab-active text-primary" id="markdown-tab" type="button" role="tab" aria-selected="true">Documentation</button>
          <button class="view-tab tab" id="json-tab" type="button" role="tab" aria-selected="false">JSON</button>
        </div>
        <div class="downloads">
          <a class="download btn btn-sm btn-outline gap-2" id="download-markdown" download>
            <i class="ph ph-download-simple text-base" aria-hidden="true"></i>
            Download .md
          </a>
          <a class="download btn btn-sm btn-outline gap-2" id="download-json" download>
            <i class="ph ph-download-simple text-base" aria-hidden="true"></i>
            Download .json
          </a>
        </div>
      </div>

      <article class="document card border border-base-300 bg-base-100 shadow-none" id="document" aria-live="polite">
        <p class="text-base-content/60">Loading chapter...</p>
      </article>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script>
    const documentView = document.querySelector("#document");
    const chapterNav = document.querySelector("#chapter-nav");
    const toolbar = document.querySelector(".toolbar");
    const viewTabs = document.querySelector(".view-tabs");
    const markdownTab = document.querySelector("#markdown-tab");
    const jsonTab = document.querySelector("#json-tab");
    const downloadMarkdown = document.querySelector("#download-markdown");
    const downloadJson = document.querySelector("#download-json");
    const assetVersion = Date.now();

    let chapters = [];
    let activeChapter;
    let activeView = "markdown";
    let markdownSource = "";
    let jsonSource = "";

    function freshUrl(path) {
      const url = new URL(path, location.href);
      url.searchParams.set("_fresh", assetVersion);
      return url;
    }

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "dark"
    });

    function showError(message) {
      documentView.innerHTML = "";
      const error = document.createElement("p");
      error.className = "alert alert-error";
      error.textContent = message;
      documentView.append(error);
    }

    function renderNavigation() {
      chapterNav.innerHTML = "";
      const stories = new Map();
      for (const chapter of chapters.filter(page => page.type === "chapter")) {
        if (!stories.has(chapter.story)) stories.set(chapter.story, []);
        stories.get(chapter.story).push(chapter);
      }

      for (const [story, entries] of stories) {
        const group = document.createElement("section");
        group.className = "story-group";

        const title = document.createElement("h2");
        title.className = "story-title";
        title.textContent = `Story ${story}`;

        const list = document.createElement("div");
        list.className = "chapter-nav menu p-0";

        for (const chapter of entries) {
          const button = document.createElement("button");
          button.className = "chapter-button btn btn-ghost h-auto min-h-10 justify-start px-3 py-2 font-normal";
          button.type = "button";
          button.textContent = `Chapter ${chapter.chapter}: ${chapter.title}`;
          button.dataset.slug = chapter.slug;
          button.setAttribute("aria-current", chapter === activeChapter ? "page" : "false");
          button.addEventListener("click", () => {
            location.hash = chapter.slug;
          });
          list.append(button);
        }

        group.append(title, list);
        chapterNav.append(group);
      }

      const resources = chapters.filter(page => page.type !== "chapter");
      if (resources.length) {
        const group = document.createElement("section");
        group.className = "story-group";

        const title = document.createElement("h2");
        title.className = "story-title";
        title.textContent = "Resources";

        const list = document.createElement("div");
        list.className = "chapter-nav menu p-0";

        for (const page of resources) {
          const button = document.createElement("button");
          button.className = "chapter-button btn btn-ghost h-auto min-h-10 justify-start px-3 py-2 font-normal";
          button.type = "button";
          button.textContent = page.title;
          button.dataset.slug = page.slug;
          button.setAttribute("aria-current", page === activeChapter ? "page" : "false");
          button.addEventListener("click", () => {
            location.hash = page.slug;
          });
          list.append(button);
        }

        group.append(title, list);
        chapterNav.append(group);
      }
    }

    async function renderMarkdown() {
      documentView.innerHTML = marked.parse(markdownSource);

      for (const table of documentView.querySelectorAll("table")) {
        const wrapper = document.createElement("div");
        wrapper.className = "table-scroll";
        table.classList.toggle("asset-table", Boolean(table.querySelector("code")));
        table.before(wrapper);
        wrapper.append(table);
      }

      const blocks = documentView.querySelectorAll("code.language-mermaid");
      for (const code of blocks) {
        const diagram = document.createElement("pre");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      }

      if (blocks.length) {
        await mermaid.run({ nodes: documentView.querySelectorAll(".mermaid") });
      }
    }

    function renderJson() {
      documentView.innerHTML = "";
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      pre.className = "json-preview";
      code.textContent = JSON.stringify(JSON.parse(jsonSource), null, 2);
      pre.append(code);
      documentView.append(pre);
    }

    async function renderActiveView() {
      markdownTab.setAttribute("aria-selected", activeView === "markdown");
      jsonTab.setAttribute("aria-selected", activeView === "json");
      markdownTab.classList.toggle("tab-active", activeView === "markdown");
      jsonTab.classList.toggle("tab-active", activeView === "json");
      markdownTab.classList.toggle("text-primary", activeView === "markdown");
      jsonTab.classList.toggle("text-primary", activeView === "json");

      try {
        if (activeView === "markdown") {
          await renderMarkdown();
        } else {
          renderJson();
        }
      } catch (error) {
        showError(`Could not render this chapter: ${error.message}`);
      }
    }

    async function openChapter(chapter) {
      activeChapter = chapter;
      const hasJson = Boolean(chapter.json);
      const isAssetPage = chapter.type === "assets";
      toolbar.hidden = isAssetPage;
      viewTabs.hidden = !hasJson;
      downloadMarkdown.hidden = isAssetPage;
      downloadJson.hidden = !hasJson || isAssetPage;
      if (!hasJson || isAssetPage) activeView = "markdown";
      document.title = chapter.type === "chapter"
        ? `${chapter.title} | Story Documentation`
        : `${chapter.title} | Story Documentation`;
      documentView.innerHTML = '<p class="text-base-content/60">Loading page...</p>';
      renderNavigation();

      try {
        const [markdownResponse, jsonResponse] = await Promise.all([
          fetch(freshUrl(chapter.markdown), { cache: "no-store" }),
          hasJson ? fetch(freshUrl(chapter.json), { cache: "no-store" }) : null
        ]);

        if (!markdownResponse.ok || (jsonResponse && !jsonResponse.ok)) {
          throw new Error("Page files were not found.");
        }

        markdownSource = await markdownResponse.text();
        jsonSource = jsonResponse ? await jsonResponse.text() : "";

        if (jsonResponse) JSON.parse(jsonSource);
        downloadMarkdown.href = freshUrl(chapter.markdown);
        downloadMarkdown.download = chapter.markdown;
        if (jsonResponse) {
          downloadJson.href = freshUrl(chapter.json);
          downloadJson.download = chapter.json;
        }
        await renderActiveView();
      } catch (error) {
        showError(`Could not load this page: ${error.message}`);
      }
    }

    function openFromHash() {
      const slug = location.hash.slice(1);
      const chapter = chapters.find(entry => entry.slug === slug) || chapters[0];
      if (chapter && chapter !== activeChapter) {
        openChapter(chapter);
      }
    }

    markdownTab.addEventListener("click", async () => {
      activeView = "markdown";
      await renderActiveView();
    });

    jsonTab.addEventListener("click", async () => {
      activeView = "json";
      await renderActiveView();
    });

    window.addEventListener("hashchange", openFromHash);

    fetch(freshUrl("chapters.json"), { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error("chapters.json was not found.");
        return response.json();
      })
      .then(data => {
        chapters = data;
        if (!chapters.length) throw new Error("No chapters are available yet.");
        openFromHash();
      })
      .catch(error => showError(
        location.protocol === "file:"
          ? "Open this page through GitHub Pages or http://127.0.0.1:4174. Direct file preview cannot load chapter files."
          : `Could not load the chapter list: ${error.message}`
      ));
  </script>
</body>
</html>
