<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Story documentation for ADA Challenge 4.">
  <title>Story Documentation</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      color-scheme: light;
      --color-primary: oklch(54.6% 0.245 262.881);
      --color-primary-content: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100dvh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100dvh;
      padding: 28px 20px;
      overflow-y: auto;
      border-right: 1px solid var(--color-base-300);
    }

    .brand {
      margin: 0 0 4px;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand-note {
      margin: 0 0 30px;
      color: color-mix(in oklab, var(--color-base-content) 60%, transparent);
      font-size: 0.875rem;
    }

    .level-group + .level-group {
      margin-top: 24px;
    }

    .level-title {
      margin: 0 0 8px;
      color: color-mix(in oklab, var(--color-base-content) 60%, transparent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chapter-nav {
      display: grid;
      gap: 6px;
    }

    .chapter-button {
      width: 100%;
      text-align: left;
    }

    .chapter-button[aria-current="page"] {
      color: var(--color-primary);
      font-weight: 700;
      background: color-mix(in oklab, var(--color-primary) 10%, white);
    }

    main {
      min-width: 0;
      padding: 40px clamp(20px, 5vw, 72px) 80px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(100%, 1040px);
      margin: 0 auto 26px;
    }

    .view-tabs,
    .downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .document {
      width: min(100%, 1040px);
      min-height: 400px;
      margin: 0 auto;
      padding: clamp(24px, 5vw, 64px);
      overflow: hidden;
    }

    .document h1,
    .document h2,
    .document h3,
    .document h4,
    .document h5 {
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .document h1 {
      margin-top: 0;
      font-size: clamp(1.875rem, 4vw, 2.5rem);
    }

    .document h2 {
      margin-top: 2.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-base-300);
    }

    .document h5 {
      margin: 3rem 0 1rem;
      font-size: 1.25rem;
    }

    .document a {
      color: var(--color-primary);
    }

    .document blockquote {
      margin: 1.5rem 0;
      padding: 14px 18px;
      background: color-mix(in oklab, var(--color-primary) 8%, white);
      border: 1px solid color-mix(in oklab, var(--color-primary) 20%, white);
      border-radius: var(--radius-box);
    }

    .document blockquote p {
      margin: 0.25rem 0;
    }

    .document table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    .document th,
    .document td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid var(--color-base-300);
    }

    .document th {
      background: var(--color-base-200);
    }

    .document code {
      padding: 0.15em 0.35em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--color-base-200);
      border-radius: var(--radius-field);
    }

    .document pre {
      max-width: 100%;
      padding: 18px;
      overflow: auto;
      background: var(--color-base-200);
      border-radius: var(--radius-box);
    }

    .document pre code {
      padding: 0;
      background: transparent;
    }

    .document .mermaid {
      display: flex;
      justify-content: center;
      padding: 24px;
      background: var(--color-base-100);
      border: 1px solid var(--color-base-300);
    }

    .json-preview {
      margin: 0;
      white-space: pre;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      .shell {
        display: block;
      }

      aside {
        position: static;
        width: 100%;
        height: auto;
        padding: 20px;
        border-right: 0;
        border-bottom: 1px solid var(--color-base-300);
      }

      .brand-note {
        margin-bottom: 18px;
      }

      .chapter-nav {
        display: flex;
        overflow-x: auto;
      }

      .chapter-button {
        width: auto;
        min-width: max-content;
      }

      main {
        padding: 24px 14px 56px;
      }

      .toolbar {
        align-items: stretch;
      }

      .view-tabs,
      .downloads {
        width: 100%;
      }

      .view-tab,
      .download {
        flex: 1;
        text-align: center;
        white-space: nowrap;
      }

      .document {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body class="bg-base-100 text-base-content">
  <div class="shell">
    <aside class="bg-base-100" aria-label="Story chapters">
      <h1 class="brand">Story Documentation</h1>
      <p class="brand-note">ADA Challenge 4</p>
      <nav id="chapter-nav"></nav>
    </aside>

    <main>
      <div class="toolbar">
        <div class="view-tabs tabs tabs-border" role="tablist" aria-label="Preview format">
          <button class="view-tab tab tab-active text-primary" id="markdown-tab" type="button" role="tab" aria-selected="true">Documentation</button>
          <button class="view-tab tab" id="json-tab" type="button" role="tab" aria-selected="false">JSON</button>
        </div>
        <div class="downloads">
          <a class="download btn btn-sm btn-outline gap-2" id="download-markdown" download>
            <i class="ph ph-download-simple text-base" aria-hidden="true"></i>
            Download .md
          </a>
          <a class="download btn btn-sm btn-outline gap-2" id="download-json" download>
            <i class="ph ph-download-simple text-base" aria-hidden="true"></i>
            Download .json
          </a>
        </div>
      </div>

      <article class="document card border border-base-300 bg-base-100 shadow-none" id="document" aria-live="polite">
        <p class="text-base-content/60">Loading chapter...</p>
      </article>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script>
    const documentView = document.querySelector("#document");
    const chapterNav = document.querySelector("#chapter-nav");
    const markdownTab = document.querySelector("#markdown-tab");
    const jsonTab = document.querySelector("#json-tab");
    const downloadMarkdown = document.querySelector("#download-markdown");
    const downloadJson = document.querySelector("#download-json");

    let chapters = [];
    let activeChapter;
    let activeView = "markdown";
    let markdownSource = "";
    let jsonSource = "";

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "neutral"
    });

    function showError(message) {
      documentView.innerHTML = "";
      const error = document.createElement("p");
      error.className = "alert alert-error";
      error.textContent = message;
      documentView.append(error);
    }

    function renderNavigation() {
      chapterNav.innerHTML = "";
      const levels = new Map();
      for (const chapter of chapters) {
        if (!levels.has(chapter.level)) levels.set(chapter.level, []);
        levels.get(chapter.level).push(chapter);
      }

      for (const [level, entries] of levels) {
        const group = document.createElement("section");
        group.className = "level-group";

        const title = document.createElement("h2");
        title.className = "level-title";
        title.textContent = `Level ${level}`;

        const list = document.createElement("div");
        list.className = "chapter-nav menu p-0";

        for (const chapter of entries) {
          const button = document.createElement("button");
          button.className = "chapter-button btn btn-ghost h-auto min-h-10 justify-start px-3 py-2 font-normal";
          button.type = "button";
          button.textContent = `Chapter ${chapter.chapter}: ${chapter.title}`;
          button.dataset.slug = chapter.slug;
          button.setAttribute("aria-current", chapter === activeChapter ? "page" : "false");
          button.addEventListener("click", () => {
            location.hash = chapter.slug;
          });
          list.append(button);
        }

        group.append(title, list);
        chapterNav.append(group);
      }
    }

    async function renderMarkdown() {
      documentView.innerHTML = marked.parse(markdownSource);

      const blocks = documentView.querySelectorAll("code.language-mermaid");
      for (const code of blocks) {
        const diagram = document.createElement("pre");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      }

      if (blocks.length) {
        await mermaid.run({ nodes: documentView.querySelectorAll(".mermaid") });
      }
    }

    function renderJson() {
      documentView.innerHTML = "";
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      pre.className = "json-preview";
      code.textContent = JSON.stringify(JSON.parse(jsonSource), null, 2);
      pre.append(code);
      documentView.append(pre);
    }

    async function renderActiveView() {
      markdownTab.setAttribute("aria-selected", activeView === "markdown");
      jsonTab.setAttribute("aria-selected", activeView === "json");
      markdownTab.classList.toggle("tab-active", activeView === "markdown");
      jsonTab.classList.toggle("tab-active", activeView === "json");
      markdownTab.classList.toggle("text-primary", activeView === "markdown");
      jsonTab.classList.toggle("text-primary", activeView === "json");

      try {
        if (activeView === "markdown") {
          await renderMarkdown();
        } else {
          renderJson();
        }
      } catch (error) {
        showError(`Could not render this chapter: ${error.message}`);
      }
    }

    async function openChapter(chapter) {
      activeChapter = chapter;
      document.title = `Level ${chapter.level}, Chapter ${chapter.chapter} | Story Documentation`;
      documentView.innerHTML = '<p class="text-base-content/60">Loading chapter...</p>';
      renderNavigation();

      try {
        const [markdownResponse, jsonResponse] = await Promise.all([
          fetch(chapter.markdown),
          fetch(chapter.json)
        ]);

        if (!markdownResponse.ok || !jsonResponse.ok) {
          throw new Error("Chapter files were not found.");
        }

        [markdownSource, jsonSource] = await Promise.all([
          markdownResponse.text(),
          jsonResponse.text()
        ]);

        JSON.parse(jsonSource);
        downloadMarkdown.href = chapter.markdown;
        downloadMarkdown.download = chapter.markdown;
        downloadJson.href = chapter.json;
        downloadJson.download = chapter.json;
        await renderActiveView();
      } catch (error) {
        showError(`Could not load this chapter: ${error.message}`);
      }
    }

    function openFromHash() {
      const slug = location.hash.slice(1);
      const chapter = chapters.find(entry => entry.slug === slug) || chapters[0];
      if (chapter && chapter !== activeChapter) {
        openChapter(chapter);
      }
    }

    markdownTab.addEventListener("click", async () => {
      activeView = "markdown";
      await renderActiveView();
    });

    jsonTab.addEventListener("click", async () => {
      activeView = "json";
      await renderActiveView();
    });

    window.addEventListener("hashchange", openFromHash);

    fetch("chapters.json")
      .then(response => {
        if (!response.ok) throw new Error("chapters.json was not found.");
        return response.json();
      })
      .then(data => {
        chapters = data;
        if (!chapters.length) throw new Error("No chapters are available yet.");
        openFromHash();
      })
      .catch(error => showError(
        location.protocol === "file:"
          ? "Open this page through GitHub Pages or http://127.0.0.1:4174. Direct file preview cannot load chapter files."
          : `Could not load the chapter list: ${error.message}`
      ));
  </script>
</body>
</html>
